<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 130" width="512" height="512">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Shield / Hexagon -->
  <rect x="1" y="1" width="128" height="128" rx="28" fill="#131D33" stroke="#2A3F66" stroke-width="2"/>
  <rect x="7" y="7" width="116" height="116" rx="22" fill="#0A0F1D" stroke="#162338" stroke-width="1"/>

  <!-- Glowing atmospheric orb -->
  <circle cx="65" cy="72" r="32" fill="#00E5FF" opacity="0.12" filter="url(#glow)"/>

  <!-- Android Robot & Craft Core -->
  <path d="M 65 30 L 78 50 L 52 50 Z" fill="#00E5FF"/>
  <circle cx="65" cy="72" r="28" fill="none" stroke="#00E5FF" stroke-width="4"/>
  <circle cx="56" cy="68" r="4" fill="#00E5FF"/>
  <circle cx="74" cy="68" r="4" fill="#00E5FF"/>
  <path d="M 45 80 Q 65 96 85 80" stroke="#38BDF8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Orbiting pulse ring -->
  <ellipse cx="65" cy="72" rx="46" ry="18" fill="none" stroke="#818CF8" stroke-width="2.5" stroke-dasharray="6 4" transform="rotate(-20 65 72)"/>
</svg>