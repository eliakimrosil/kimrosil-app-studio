<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B130E"/>
      <stop offset="50%" stop-color="#11241A"/>
      <stop offset="100%" stop-color="#051C11"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#254231" stroke-width="4"/>

  <!-- Concentric Track -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#1B3827" stroke-width="26"/>

  <!-- Dynamic Habit Loop Arc -->
  <path d="M 256 116 A 140 140 0 1 1 148 168" fill="none" stroke="url(#ringGrad)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Leading Momentum Spark Node -->
  <circle cx="256" cy="116" r="20" fill="#69F0AE" filter="url(#glow)"/>
  <circle cx="256" cy="116" r="10" fill="#FFFFFF"/>

  <!-- Center Checkmark -->
  <path d="M 196 260 L 236 304 L 324 208" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Sparkle Accent -->
  <polygon points="380,140 390,110 400,140 430,150 400,160 390,190 380,160 350,150" fill="#FFD54F"/>
</svg>
