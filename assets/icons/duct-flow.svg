<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="ductGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Sheet metal cross break pattern -->
  <line x1="64" y1="64" x2="448" y2="448" stroke="#334155" stroke-width="3" opacity="0.4"/>
  <line x1="64" y1="448" x2="448" y2="64" stroke="#334155" stroke-width="3" opacity="0.4"/>
  <!-- Outer rectangular duct profile with 3D flange -->
  <rect x="110" y="130" width="200" height="252" rx="16" fill="#1538BDF8" stroke="#38BDF8" stroke-width="14"/>
  <path d="M310,130 L390,190 L390,320 L310,382" fill="#220284C7" stroke="#0EA5E9" stroke-width="12"/>
  <path d="M110,130 L190,190 L390,190" stroke="#0EA5E9" stroke-width="12"/>
  <!-- Spiral round duct overlay -->
  <circle cx="210" cy="256" r="86" fill="none" stroke="#67E8F9" stroke-width="10"/>
  <!-- Airflow streamlines -->
  <path d="M150,256 L265,256 M235,225 L265,256 L235,287" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165,200 L245,200 M225,180 L245,200 L225,220" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M165,312 L245,312 M225,292 L245,312 L225,332" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Golden spark accent -->
  <polygon points="360,170 370,150 380,170 400,180 380,190 370,210 360,190 340,180" fill="#FBBF24"/>
</svg>
