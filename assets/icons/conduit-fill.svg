<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="conduitBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161D26"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
    <linearGradient id="galvSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="112" fill="url(#conduitBg)"/>

  <!-- Galvanized Conduit Outer Pipe Wall -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#galvSteel)" stroke-width="28"/>
  <circle cx="256" cy="256" r="166" fill="#0B0E14"/>

  <!-- 40% Permissible Fill Limit Arc (Safety Amber) -->
  <path d="M 138 180 A 166 166 0 0 1 374 180" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linecap="round" filter="url(#amberGlow)"/>

  <!-- Bundled Conductors Inside Conduit -->
  <!-- Phase A: Black Conductor with Copper Core -->
  <circle cx="205" cy="210" r="44" fill="#1E293B" stroke="#475569" stroke-width="4"/>
  <circle cx="205" cy="210" r="22" fill="#F97316"/>

  <!-- Phase B: Red Conductor with Copper Core -->
  <circle cx="307" cy="210" r="44" fill="#EF4444" stroke="#B91C1C" stroke-width="4"/>
  <circle cx="307" cy="210" r="22" fill="#F97316"/>

  <!-- Phase C: Blue Conductor with Copper Core -->
  <circle cx="256" cy="298" r="44" fill="#3B82F6" stroke="#1D4ED8" stroke-width="4"/>
  <circle cx="256" cy="298" r="22" fill="#F97316"/>

  <!-- Neutral (White) -->
  <circle cx="170" cy="305" r="30" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
  <circle cx="170" cy="305" r="14" fill="#F97316"/>

  <!-- Equipment Grounding (Green) -->
  <circle cx="342" cy="305" r="30" fill="#10B981" stroke="#047857" stroke-width="3"/>
  <circle cx="342" cy="305" r="14" fill="#F97316"/>

  <!-- High-Voltage Lightning Spark Accent -->
  <polygon points="256,380 240,410 254,410 246,436 272,398 258,398" fill="#F59E0B" filter="url(#amberGlow)"/>
</svg>
