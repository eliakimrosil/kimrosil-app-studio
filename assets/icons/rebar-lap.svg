<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#081024" />
      <stop offset="100%" stop-color="#000814" />
    </linearGradient>
    <filter id="wireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Blueprint Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Blueprint Dimension Grid -->
  <g stroke="#1E2E56" stroke-width="2" opacity="0.6">
    <line x1="64" y1="64" x2="64" y2="448" />
    <line x1="160" y1="64" x2="160" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="352" y1="64" x2="352" y2="448" />
    <line x1="448" y1="64" x2="448" y2="448" />
    <line x1="64" y1="64" x2="448" y2="64" />
    <line x1="64" y1="160" x2="448" y2="160" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="352" x2="448" y2="352" />
    <line x1="64" y1="448" x2="448" y2="448" />
  </g>

  <!-- Top Rebar with Hook on Right (x=110 to 380, hook down to 310) -->
  <path d="M110,210 L370,210 Q394,210 394,234 L394,310" fill="none" stroke="#60A5FA" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Rebar Deformation Ribs -->
  <g stroke="#93C5FD" stroke-width="8" stroke-linecap="round">
    <line x1="140" y1="190" x2="160" y2="230" />
    <line x1="190" y1="190" x2="210" y2="230" />
    <line x1="240" y1="190" x2="260" y2="230" />
    <line x1="290" y1="190" x2="310" y2="230" />
    <line x1="340" y1="190" x2="360" y2="230" />
  </g>

  <!-- Bottom Rebar with Hook on Left (x=142 to 402, hook up to 202) -->
  <path d="M402,282 L142,282 Q118,282 118,258 L118,182" fill="none" stroke="#2563EB" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Bottom Rebar Deformation Ribs -->
  <g stroke="#60A5FA" stroke-width="8" stroke-linecap="round">
    <line x1="372" y1="262" x2="352" y2="302" />
    <line x1="322" y1="262" x2="302" y2="302" />
    <line x1="272" y1="262" x2="252" y2="302" />
    <line x1="222" y1="262" x2="202" y2="302" />
    <line x1="172" y1="262" x2="152" y2="302" />
  </g>

  <!-- Tie Wire Wraps in Splice Zone -->
  <g stroke="#F59E0B" stroke-width="10" stroke-linecap="round" filter="url(#wireGlow)">
    <line x1="195" y1="184" x2="215" y2="308" />
    <line x1="305" y1="184" x2="325" y2="308" />
  </g>

  <!-- Lap Splice Dimension Line (Ls) -->
  <g stroke="#FBBF24" stroke-width="6" stroke-linecap="round">
    <line x1="142" y1="360" x2="370" y2="360" />
    <line x1="142" y1="342" x2="142" y2="378" />
    <line x1="370" y1="342" x2="370" y2="378" />
  </g>
</svg>
