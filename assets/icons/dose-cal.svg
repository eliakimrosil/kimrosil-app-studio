<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#042F2E" />
      <stop offset="100%" stop-color="#021C17" />
    </linearGradient>
    <linearGradient id="fluidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Medical Crosshair & Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#0D9488" stroke-width="2" stroke-opacity="0.2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-opacity="0.2" />
  <line x1="256" y1="48" x2="256" y2="464" stroke="#115E59" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <line x1="48" y1="256" x2="464" y2="256" stroke="#115E59" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- Droplet above Tip -->
  <path d="M256,92 C248,106 238,118 238,130 A18,18 0 0,0 274,130 C274,118 264,106 256,92 Z" fill="#34D399" filter="url(#glow)" />

  <!-- Luer Syringe Tip -->
  <rect x="246" y="136" width="20" height="24" rx="3" fill="#E2E8F0" />

  <!-- Syringe Outer Glass Barrel -->
  <rect x="200" y="160" width="112" height="200" rx="10" fill="#0F172A" fill-opacity="0.75" stroke="#94A3B8" stroke-width="6" />

  <!-- Emerald Fluid Volume Fill -->
  <rect x="206" y="240" width="100" height="116" fill="url(#fluidGrad)" fill-opacity="0.9" />

  <!-- Fluid Meniscus Highlight -->
  <line x1="206" y1="240" x2="306" y2="240" stroke="#6EE7B7" stroke-width="6" stroke-linecap="round" />

  <!-- Precision Measurement Graduations -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <line x1="206" y1="190" x2="242" y2="190" stroke-width="5" />
    <line x1="206" y1="215" x2="228" y2="215" stroke-width="3" />
    <line x1="206" y1="240" x2="242" y2="240" stroke-width="5" />
    <line x1="206" y1="265" x2="228" y2="265" stroke-width="3" />
    <line x1="206" y1="290" x2="242" y2="290" stroke-width="5" />
    <line x1="206" y1="315" x2="228" y2="315" stroke-width="3" />
    <line x1="206" y1="340" x2="242" y2="340" stroke-width="5" />
  </g>

  <!-- Finger Flanges -->
  <rect x="156" y="360" width="200" height="18" rx="8" fill="#CBD5E1" />

  <!-- Plunger Rubber Stopper -->
  <rect x="204" y="356" width="104" height="10" rx="2" fill="#334155" />

  <!-- Plunger Shaft -->
  <rect x="242" y="378" width="28" height="48" rx="4" fill="#94A3B8" />

  <!-- Plunger Thumb Press Flange -->
  <rect x="196" y="426" width="120" height="16" rx="6" fill="#CBD5E1" />
</svg>
