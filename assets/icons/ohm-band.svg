<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pcbBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161B22"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>
    <linearGradient id="ceramicBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EDE2CB"/>
      <stop offset="30%" stop-color="#FFFDF8"/>
      <stop offset="70%" stop-color="#E2D4B7"/>
      <stop offset="100%" stop-color="#C2B291"/>
    </linearGradient>
    <linearGradient id="goldLead" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Surface -->
  <rect width="512" height="512" rx="112" fill="url(#pcbBg)"/>

  <!-- PCB Copper Trace Lines -->
  <path d="M 60 120 L 180 120 L 230 170 L 420 170" fill="none" stroke="#21262D" stroke-width="6"/>
  <path d="M 80 400 L 200 400 L 260 340 L 440 340" fill="none" stroke="#21262D" stroke-width="6"/>
  <circle cx="420" cy="170" r="10" fill="#30363D"/>
  <circle cx="80" cy="400" r="10" fill="#30363D"/>

  <!-- Axial Resistor Leads -->
  <line x1="60" y1="256" x2="150" y2="256" stroke="url(#goldLead)" stroke-width="16" stroke-linecap="round"/>
  <line x1="362" y1="256" x2="452" y2="256" stroke="url(#goldLead)" stroke-width="16" stroke-linecap="round"/>

  <!-- Resistor Body with Bulged Ends -->
  <path d="M 150 216 C 140 224 140 288 150 296 C 160 304 180 304 190 296 L 322 296 C 332 304 352 304 362 296 C 372 288 372 224 362 216 C 352 208 332 208 322 216 L 190 216 C 180 208 160 208 150 216 Z" fill="url(#ceramicBody)" stroke="#30363D" stroke-width="3"/>

  <!-- Vibrant Resistor Color Bands -->
  <!-- Band 1: Brown (Digit 1) -->
  <rect x="175" y="210" width="22" height="92" rx="4" fill="#8B4513"/>
  <!-- Band 2: Black (Digit 0) -->
  <rect x="217" y="215" width="22" height="82" rx="4" fill="#1E1E1E"/>
  <!-- Band 3: Red (Multiplier x100) -->
  <rect x="259" y="215" width="22" height="82" rx="4" fill="#EF4444"/>
  <!-- Band 4: Gold (Tolerance +/- 5%) -->
  <rect x="315" y="210" width="24" height="92" rx="4" fill="#F59E0B" filter="url(#goldGlow)"/>

  <!-- Golden Omega (Ohm) Symbol -->
  <path d="M 220 370 L 238 370 C 238 370 230 335 256 335 C 282 335 274 370 274 370 L 292 370" fill="none" stroke="#F59E0B" stroke-width="10" stroke-linecap="round" filter="url(#goldGlow)"/>
</svg>
