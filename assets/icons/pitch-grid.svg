<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Radial phosphor glow -->
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080A0D" stop-opacity="1"/>
    </radialGradient>
    <!-- Waveform neon glow filter -->
    <filter id="neonCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modular Rack Faceplate -->
  <rect width="512" height="512" rx="48" fill="#0E1013"/>
  <rect x="12" y="12" width="488" height="488" rx="36" fill="none" stroke="#252A34" stroke-width="3"/>

  <!-- Tactical Rack Screws in Corners -->
  <!-- Top Left -->
  <circle cx="48" cy="48" r="14" fill="#1C2129" stroke="#374151" stroke-width="2"/>
  <line x1="41" y1="48" x2="55" y2="48" stroke="#4B5563" stroke-width="3"/>
  <line x1="48" y1="41" x2="48" y2="55" stroke="#4B5563" stroke-width="3"/>

  <!-- Top Right -->
  <circle cx="464" cy="48" r="14" fill="#1C2129" stroke="#374151" stroke-width="2"/>
  <line x1="457" y1="48" x2="471" y2="48" stroke="#4B5563" stroke-width="3"/>
  <line x1="464" y1="41" x2="464" y2="55" stroke="#4B5563" stroke-width="3"/>

  <!-- Bottom Left -->
  <circle cx="48" cy="464" r="14" fill="#1C2129" stroke="#374151" stroke-width="2"/>
  <line x1="41" y1="464" x2="55" y2="464" stroke="#4B5563" stroke-width="3"/>
  <line x1="48" y1="457" x2="48" y2="471" stroke="#4B5563" stroke-width="3"/>

  <!-- Bottom Right -->
  <circle cx="464" cy="464" r="14" fill="#1C2129" stroke="#374151" stroke-width="2"/>
  <line x1="457" y1="464" x2="471" y2="464" stroke="#4B5563" stroke-width="3"/>
  <line x1="464" y1="457" x2="464" y2="471" stroke="#4B5563" stroke-width="3"/>

  <!-- Oscilloscope Bezel -->
  <rect x="72" y="88" width="368" height="336" rx="28" fill="#14181F" stroke="#2E3746" stroke-width="4"/>
  <rect x="88" y="104" width="336" height="304" rx="20" fill="url(#crtGlow)"/>

  <!-- CRT Reticle Grid -->
  <g stroke="#182330" stroke-width="2">
    <!-- Vertical Division Lines -->
    <line x1="130" y1="104" x2="130" y2="408"/>
    <line x1="172" y1="104" x2="172" y2="408"/>
    <line x1="214" y1="104" x2="214" y2="408"/>
    <line x1="256" y1="104" x2="256" y2="408" stroke="#25384E" stroke-width="3"/>
    <line x1="298" y1="104" x2="298" y2="408"/>
    <line x1="340" y1="104" x2="340" y2="408"/>
    <line x1="382" y1="104" x2="382" y2="408"/>

    <!-- Horizontal Division Lines -->
    <line x1="88" y1="154" x2="424" y2="154"/>
    <line x1="88" y1="205" x2="424" y2="205"/>
    <line x1="88" y1="256" x2="424" y2="256" stroke="#25384E" stroke-width="3"/>
    <line x1="88" y1="307" x2="424" y2="307"/>
    <line x1="88" y1="358" x2="424" y2="358"/>
  </g>

  <!-- Live Studio Tally LED (Top Right of Bezel) -->
  <circle cx="396" cy="132" r="10" fill="#FF3D00" filter="drop-shadow(0px 0px 8px #FF3D00)"/>

  <!-- Primary Oscilloscope Trace: High-Precision Harmonic Waveform -->
  <path d="M 96,256 C 120,256 140,140 176,140 C 212,140 232,372 256,372 C 280,372 300,140 336,140 C 372,140 392,256 416,256"
        fill="none"
        stroke="#00E5FF"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonCyan)"/>

  <!-- Secondary Warm Amber Core Beam -->
  <path d="M 96,256 C 126,256 150,190 176,190 C 202,190 226,322 256,322 C 286,322 310,190 336,190 C 362,190 386,256 416,256"
        fill="none"
        stroke="#FFB300"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Cents Calibration Scale Markers (Bottom) -->
  <g stroke="#FFB300" stroke-width="3">
    <line x1="176" y1="392" x2="176" y2="402"/>
    <line x1="216" y1="395" x2="216" y2="402"/>
    <line x1="256" y1="388" x2="256" y2="402" stroke-width="4"/>
    <line x1="296" y1="395" x2="296" y2="402"/>
    <line x1="336" y1="392" x2="336" y2="402"/>
  </g>
</svg>
