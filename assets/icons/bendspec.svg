      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#141C28"/>
    </linearGradient>
    <linearGradient id="punchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle blueprint grid -->
  <rect width="108" height="108" rx="24" fill="url(#bgGrad)"/>
  <path d="M18,0v108 M36,0v108 M54,0v108 M72,0v108 M90,0v108 M0,18h108 M0,36h108 M0,54h108 M0,72h108 M0,90h108" stroke="#1E293B" stroke-width="0.8"/>
  <circle cx="54" cy="54" r="38" fill="none" stroke="#1A2840" stroke-width="1.2"/>
  
