<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1510"/>
      <stop offset="50%" stop-color="#140E0B"/>
      <stop offset="100%" stop-color="#0E0907"/>
    </linearGradient>
    <radialGradient id="cremaGlow" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#E69A38" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#E69A38" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="prismBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="28" y="28" width="456" height="456" rx="92" fill="none" stroke="#3D2B20" stroke-width="3"/>

  <!-- Extraction Grid & Optical Rings -->
  <circle cx="256" cy="246" r="190" fill="url(#cremaGlow)" stroke="#2E2018" stroke-width="2"/>
  <circle cx="256" cy="246" r="142" fill="none" stroke="#3A281E" stroke-width="1.5" stroke-dasharray="8 6"/>
  <line x1="66" y1="170" x2="446" y2="170" stroke="#2B1E16" stroke-width="1.5"/>
  <line x1="66" y1="256" x2="446" y2="256" stroke="#2B1E16" stroke-width="1.5"/>
  <line x1="66" y1="342" x2="446" y2="342" stroke="#2B1E16" stroke-width="1.5"/>
  <line x1="170" y1="66" x2="170" y2="446" stroke="#2B1E16" stroke-width="1.5"/>
  <line x1="256" y1="66" x2="256" y2="446" stroke="#2B1E16" stroke-width="1.5"/>
  <line x1="342" y1="66" x2="342" y2="446" stroke="#2B1E16" stroke-width="1.5"/>

  <!-- Digital Gravimetric Scale Base -->
  <rect x="116" y="344" width="280" height="60" rx="18" fill="#261B14" stroke="url(#goldAccent)" stroke-width="7"/>
  <polygon points="154,328 358,328 370,344 142,344" fill="#D98A2B"/>
  <!-- OLED Display Window -->
  <rect x="142" y="360" width="136" height="28" rx="6" fill="#0F0A08" stroke="#3E2C22" stroke-width="2"/>
  <rect x="156" y="369" width="44" height="10" rx="3" fill="#2DD4BF"/>
  <rect x="212" y="369" width="50" height="10" rx="3" fill="#FBBF24"/>
  <!-- Tare / Timer Tactile Buttons -->
  <circle cx="318" cy="374" r="10" fill="#E69A38"/>
  <circle cx="356" cy="374" r="10" fill="#2DD4BF"/>

  <!-- V60 Conical Pour-Over Dripper -->
  <polygon points="140,146 372,146 304,268 208,268" fill="#33231A" stroke="url(#goldAccent)" stroke-width="10" stroke-linejoin="round"/>
  <!-- Spiral Internal Extraction Ribs -->
  <line x1="178" y1="162" x2="224" y2="254" stroke="#B87324" stroke-width="6" stroke-linecap="round"/>
  <line x1="224" y1="162" x2="248" y2="254" stroke="#B87324" stroke-width="6" stroke-linecap="round"/>
  <line x1="284" y1="162" x2="264" y2="254" stroke="#B87324" stroke-width="6" stroke-linecap="round"/>
  <line x1="332" y1="162" x2="288" y2="254" stroke="#B87324" stroke-width="6" stroke-linecap="round"/>
  <!-- Dripper Handle -->
  <path d="M362,162 C402,162 408,212 368,228 L324,238" fill="none" stroke="url(#goldAccent)" stroke-width="10" stroke-linecap="round"/>
  <!-- Dripper Base Collar -->
  <rect x="188" y="264" width="136" height="14" rx="5" fill="url(#goldAccent)"/>

  <!-- Refractometer Optical Laser Beam -->
  <polyline points="96,298 236,304 416,268" fill="none" stroke="url(#prismBeam)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Extracted Golden Coffee Droplet -->
  <path d="M256,280 C256,280 232,304 232,316 A24,24 0 1,0 280,316 C280,304 256,280 256,280 Z" fill="url(#goldAccent)" stroke="#FEF3C7" stroke-width="5"/>

  <!-- Aroma Waves -->
  <path d="M210,124 C200,108 220,96 210,80" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
  <path d="M256,118 C246,102 266,90 256,74" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
  <path d="M302,124 C292,108 312,96 302,80" fill="none" stroke="#FBBF24" stroke-width="8" stroke-linecap="round"/>
</svg>
