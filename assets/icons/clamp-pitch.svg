<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#92400E"/>
      <stop offset="60%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C1917"/>
    </radialGradient>
    <linearGradient id="steelBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="amberJaw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="timberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="25%" stop-color="#92400E"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F59E0B" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Workshop Grid Details -->
  <line x1="64" y1="128" x2="448" y2="128" stroke="#78350F" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#78350F" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="64" y1="384" x2="448" y2="384" stroke="#78350F" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Clamp I-Beam Steel Bar -->
  <rect x="96" y="184" width="320" height="36" rx="4" fill="url(#steelBar)"/>
  <line x1="96" y1="202" x2="416" y2="202" stroke="#475569" stroke-width="4"/>

  <!-- Clamped Woodwork Workpiece -->
  <rect x="176" y="232" width="160" height="112" rx="8" fill="url(#timberGrad)"/>
  <!-- Glueline Compression Centerline -->
  <line x1="256" y1="232" x2="256" y2="344" stroke="#FDE68A" stroke-width="4" stroke-dasharray="8 4"/>

  <!-- Left Anvil Fixed Jaw -->
  <rect x="112" y="152" width="60" height="216" rx="10" fill="url(#amberJaw)"/>
  <rect x="162" y="216" width="12" height="136" rx="2" fill="#292524"/>

  <!-- Right Sliding Screw Jaw -->
  <rect x="340" y="152" width="60" height="216" rx="10" fill="url(#amberJaw)"/>
  <rect x="338" y="216" width="12" height="136" rx="2" fill="#292524"/>

  <!-- Precision Screw & Handle -->
  <rect x="400" y="244" width="32" height="28" rx="4" fill="url(#steelBar)"/>
  <rect x="432" y="212" width="20" height="92" rx="8" fill="url(#amberJaw)"/>

  <!-- Pressure Vectors -->
  <path d="M228 288 L244 272 L238 272 L220 288 L238 304 L244 304 Z" fill="#FFFFFF"/>
  <path d="M284 288 L268 272 L274 272 L292 288 L274 304 L268 304 Z" fill="#FFFFFF"/>
</svg>
