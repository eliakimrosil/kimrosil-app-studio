<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="eatGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F1E36" />
      <stop offset="70%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#04060A" />
    </radialGradient>
  </defs>

  <!-- Deep Athletic Obsidian Base Plate -->
  <rect width="512" height="512" rx="115" fill="url(#bgGlow)" />

  <!-- Subtle Guidance Rings -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#111E33" stroke-width="4" />
  <circle cx="256" cy="256" r="132" fill="none" stroke="#0C1626" stroke-width="3" stroke-dasharray="6 6" />

  <!-- Cardinal Segment Dividers -->
  <line x1="256" y1="66" x2="256" y2="95" stroke="#1F2F4D" stroke-width="5" stroke-linecap="round" />
  <line x1="256" y1="417" x2="256" y2="446" stroke="#1F2F4D" stroke-width="5" stroke-linecap="round" />
  <line x1="66" y1="256" x2="95" y2="256" stroke="#1F2F4D" stroke-width="5" stroke-linecap="round" />
  <line x1="417" y1="256" x2="446" y2="256" stroke="#1F2F4D" stroke-width="5" stroke-linecap="round" />

  <!-- 16-Hour Fasting Arc (240 degrees, clockwise from top 0 to 240 deg) -->
  <!-- r=118, cx=256, cy=256. Start at (256, 138). End at 240 deg: x = 256 + 118*sin(240 deg) = 256 - 102.19 = 153.8, y = 256 - 118*cos(240 deg) = 256 + 59 = 315 -->
  <path d="M 256,138 A 118,118 0 1,1 153.8,315" fill="none" stroke="url(#arcGrad)" stroke-width="26" stroke-linecap="round" />

  <!-- 8-Hour Eating Window Arc (120 degrees, from 240 deg to 360 deg) -->
  <path d="M 143,297 A 118,118 0 0,1 237,139" fill="none" stroke="url(#eatGrad)" stroke-width="14" stroke-linecap="round" opacity="0.8" />

  <!-- Metabolic Pulse Head at 240 degrees -->
  <circle cx="153.8" cy="315" r="16" fill="#34D399" filter="drop-shadow(0px 0px 8px #10B981)" />

  <!-- 12 O'Clock Zero Pivot Marker -->
  <circle cx="256" cy="138" r="12" fill="#FFFFFF" />

  <!-- Central Fasting Energy Core -->
  <path d="M 256,200 C 256,200 218,238 218,266 A 38,38 0 0,0 294,266 C 294,238 256,200 256,200 Z" fill="#00E5FF" />
  <path d="M 256,220 C 256,220 232,244 232,262 A 24,24 0 0,0 280,262 C 280,244 256,220 256,220 Z" fill="#E0F2FE" />
</svg>