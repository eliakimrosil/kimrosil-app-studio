<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#004D40" />
      <stop offset="100%" stop-color="#00251A" />
    </linearGradient>
    <linearGradient id="fuelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CFD8DC" />
      <stop offset="50%" stop-color="#ECEFF1" />
      <stop offset="100%" stop-color="#B0BEC5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Industrial Engineering Grid Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2">
    <line x1="64" y1="128" x2="448" y2="128" />
    <line x1="64" y1="256" x2="448" y2="256" />
    <line x1="64" y1="384" x2="448" y2="384" />
    <line x1="128" y1="64" x2="128" y2="448" />
    <line x1="256" y1="64" x2="256" y2="448" />
    <line x1="384" y1="64" x2="384" y2="448" />
  </g>

  <!-- Fluid Reservoir with Dynamic Meniscus -->
  <path d="M96 300 C150 285 200 310 256 295 C312 280 362 305 416 290 L416 390 C416 412 398 430 376 430 L136 430 C114 430 96 412 96 390 Z" fill="url(#fuelGrad)" filter="url(#shadow)" />
  <path d="M96 300 C150 285 200 310 256 295 C312 280 362 305 416 290 L416 310 C362 325 312 300 256 315 C200 330 150 305 96 320 Z" fill="#FFE082" opacity="0.8" />

  <!-- Calibrated Dipstick Blade -->
  <g filter="url(#shadow)">
    <!-- T-Handle -->
    <rect x="196" y="70" width="120" height="28" rx="12" fill="#90A4AE" />
    <circle cx="256" cy="84" r="7" fill="#37474F" />

    <!-- Main Blade -->
    <rect x="226" y="98" width="60" height="295" rx="8" fill="url(#bladeGrad)" stroke="#78909C" stroke-width="3" />

    <!-- Calibration Hash Marks -->
    <g stroke="#37474F" stroke-width="4" stroke-linecap="round">
      <line x1="226" y1="130" x2="256" y2="130" />
      <line x1="226" y1="160" x2="276" y2="160" />
      <line x1="226" y1="190" x2="250" y2="190" />
      <line x1="226" y1="220" x2="276" y2="220" />
      <line x1="226" y1="250" x2="256" y2="250" />
      <line x1="226" y1="280" x2="280" y2="280" />
      <line x1="226" y1="310" x2="256" y2="310" />
      <line x1="226" y1="340" x2="276" y2="340" />
      <line x1="226" y1="370" x2="250" y2="370" />
    </g>

    <!-- Numeric Gauge Marks -->
    <text x="264" y="165" font-family="monospace" font-size="14" font-weight="bold" fill="#263238">50</text>
    <text x="264" y="225" font-family="monospace" font-size="14" font-weight="bold" fill="#263238">100</text>
    <text x="264" y="285" font-family="monospace" font-size="14" font-weight="bold" fill="#263238">150</text>
    <text x="264" y="345" font-family="monospace" font-size="14" font-weight="bold" fill="#263238">200</text>
  </g>

  <!-- Fluid droplet adhering to dipstick tip -->
  <path d="M256 385 C256 385 272 402 272 414 C272 423 265 430 256 430 C247 430 240 423 240 414 C240 402 256 385 256 385 Z" fill="#FFC107" filter="url(#shadow)" />

  <!-- Highlights & Sparkle -->
  <polygon points="340,110 346,124 360,130 346,136 340,150 334,136 320,130 334,124" fill="#FFFFFF" opacity="0.9" />
</svg>
