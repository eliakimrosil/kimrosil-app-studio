<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090E17" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="copperGleam" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FED7AA" />
      <stop offset="40%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#C2410C" />
    </radialGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- High-Voltage Circular Radial Rings -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#1E293B" stroke-width="2" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 8" />

  <!-- Outer Protective Conduit Pipe Shell -->
  <circle cx="256" cy="256" r="150" fill="#131D2E" stroke="#64748B" stroke-width="14" />

  <!-- Phase 1: Blue Conductor (Top) -->
  <circle cx="256" cy="180" r="54" fill="#0284C7" stroke="#38BDF8" stroke-width="6" />
  <circle cx="256" cy="180" r="28" fill="url(#copperGleam)" stroke="#B45309" stroke-width="3" />

  <!-- Phase 2: Red Conductor (Bottom-Left) -->
  <circle cx="190" cy="296" r="54" fill="#DC2626" stroke="#F87171" stroke-width="6" />
  <circle cx="190" cy="296" r="28" fill="url(#copperGleam)" stroke="#B45309" stroke-width="3" />

  <!-- Phase 3: Charcoal Conductor (Bottom-Right) -->
  <circle cx="322" cy="296" r="54" fill="#334155" stroke="#94A3B8" stroke-width="6" />
  <circle cx="322" cy="296" r="28" fill="url(#copperGleam)" stroke="#B45309" stroke-width="3" />

  <!-- Central High-Voltage Ampere Lightning Bolt -->
  <polygon points="262,190 220,256 250,256 240,320 292,246 262,246" fill="#FBBF24" stroke="#D97706" stroke-width="4" filter="url(#boltGlow)" />
</svg>
