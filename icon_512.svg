<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A10"/>
      <stop offset="50%" stop-color="#0D1624"/>
      <stop offset="100%" stop-color="#14111E"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.24"/>
      <stop offset="55%" stop-color="#F59E0B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060A10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162336"/>
      <stop offset="100%" stop-color="#0B121C"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowGrad)"/>

  <!-- Tactical Grid -->
  <g stroke="#38BDF8" stroke-opacity="0.09" stroke-width="2.5">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00E5FF" stroke-opacity="0.14" stroke-width="3.5"/>

  <!-- Drop Shadow -->
  <rect x="132" y="128" width="248" height="264" rx="32" fill="#000000" fill-opacity="0.45"/>

  <!-- Magnetometer Chassis -->
  <rect x="132" y="122" width="248" height="260" rx="30" fill="url(#bodyGrad)" stroke="#00E5FF" stroke-width="7.5"/>

  <!-- Magnetic Flux Field Lines -->
  <path d="M202,164 C224,138 288,138 310,164" fill="none" stroke="#F59E0B" stroke-width="9" stroke-linecap="round"/>
  <path d="M216,180 C232,160 280,160 296,180" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round"/>

  <!-- U-Shaped Dipole Magnet -->
  <path d="M194,188 L194,236 A62,62 0 0,0 318,236 L318,188" fill="none" stroke="#00E5FF" stroke-width="25"/>
  <path d="M194,188 L194,236 A62,62 0 0,0 256,298" fill="none" stroke="#EF4444" stroke-width="25"/>
  <rect x="181" y="178" width="26" height="20" fill="#F1F5F9"/>
  <rect x="305" y="178" width="26" height="20" fill="#F1F5F9"/>

  <!-- Lower Oscilloscope Window -->
  <rect x="158" y="312" width="196" height="50" rx="10" fill="#070D14" stroke="#1E293B" stroke-width="4.5"/>
  <polyline points="168,337 204,337 218,320 236,354 256,316 274,352 290,328 308,337 344,337" fill="none" stroke="#10B981" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
