<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C12"/>
      <stop offset="50%" stop-color="#0F1722"/>
      <stop offset="100%" stop-color="#0B1918"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#00E5FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#080C12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="vialGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="50%" stop-color="#BEF264"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
  </defs>

  <!-- Base Icon Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowGrad)"/>

  <!-- Machinist Crosshair Grid -->
  <g stroke="#94A3B8" stroke-opacity="0.09" stroke-width="2.5">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#84CC16" stroke-opacity="0.16" stroke-width="3.5"/>

  <!-- Drop Shadow -->
  <rect x="128" y="128" width="256" height="264" rx="32" fill="#000000" fill-opacity="0.45"/>

  <!-- Clinometer Housing -->
  <rect x="128" y="122" width="256" height="260" rx="30" fill="url(#frameGrad)" stroke="#84CC16" stroke-width="7.5"/>

  <!-- Upper Protractor Dial Window -->
  <rect x="152" y="146" width="208" height="118" rx="16" fill="#090D14" stroke="#334155" stroke-width="4.5"/>

  <!-- Protractor Arc & True Level Segment -->
  <path d="M182,246 A74,74 0 0,1 330,246" fill="none" stroke="#00E5FF" stroke-width="14" stroke-linecap="round"/>
  <path d="M232,175 A74,74 0 0,1 280,175" fill="none" stroke="#A3E635" stroke-width="16" stroke-linecap="round"/>

  <!-- Needle & Hub -->
  <line x1="256" y1="246" x2="256" y2="180" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
  <circle cx="256" cy="246" r="13" fill="#A3E635"/>

  <!-- Lower Illuminated Spirit Level Vial -->
  <rect x="152" y="280" width="208" height="64" rx="32" fill="url(#vialGrad)" stroke="#ECFCCB" stroke-width="5"/>
  <line x1="226" y1="280" x2="226" y2="344" stroke="#1A2E05" stroke-width="7"/>
  <line x1="286" y1="280" x2="286" y2="344" stroke="#1A2E05" stroke-width="7"/>
  <ellipse cx="256" cy="304" rx="20" ry="13" fill="#FFFFFF"/>

  <!-- Bottom Roof Pitch X:12 Emblem -->
  <line x1="166" y1="362" x2="266" y2="362" stroke="#00E5FF" stroke-width="9" stroke-linecap="round"/>
  <polygon points="292,366 346,366 346,348" fill="#00E5FF"/>
</svg>
