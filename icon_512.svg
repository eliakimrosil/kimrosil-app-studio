<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0A0D14"/>
    </linearGradient>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="torchGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="100" fill="none" stroke="#1E293B" stroke-width="4"/>

  <!-- Concentric Alignment Guide Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#334155" stroke-dasharray="8 8" stroke-width="3" opacity="0.4"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="#475569" stroke-width="4" opacity="0.6"/>

  <!-- Copper Fitting Outer Collar -->
  <circle cx="256" cy="256" r="115" fill="none" stroke="url(#copperGrad)" stroke-width="28"/>

  <!-- Silver Brazing Preform Alloy Ring (Glowing) -->
  <circle cx="256" cy="256" r="92" fill="none" stroke="url(#silverRing)" stroke-width="14"/>
  <circle cx="256" cy="256" r="92" fill="none" stroke="#FDE047" stroke-width="4" opacity="0.8"/>

  <!-- Inner Copper Pipe Tube -->
  <circle cx="256" cy="256" r="76" fill="#0A0D14" stroke="url(#copperGrad)" stroke-width="16"/>

  <!-- Core Flow Cavity & Torch Flame Emblem -->
  <path d="M256,190 C270,225 285,245 285,268 C285,284 272,298 256,298 C240,298 227,284 227,268 C227,245 242,225 256,190 Z" fill="url(#torchGlow)"/>
  <circle cx="256" cy="270" r="10" fill="#E0F2FE"/>

  <!-- Technical Dimension Ticks -->
  <line x1="256" y1="36" x2="256" y2="56" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="456" x2="256" y2="476" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="56" y2="256" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
  <line x1="456" y1="256" x2="476" y2="256" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>
</svg>
