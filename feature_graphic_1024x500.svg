<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="25%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0F1F38" />
      <stop offset="60%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#05070B" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#CC0033" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151D2E" />
      <stop offset="100%" stop-color="#0D131F" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#00FF88" />
      <stop offset="90%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF1744" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGlow)" />

  <!-- Studio Subtle Grid Lines -->
  <g stroke="#162238" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1024" y2="100" />
    <line x1="0" y1="200" x2="1024" y2="200" />
    <line x1="0" y1="300" x2="1024" y2="300" />
    <line x1="0" y1="400" x2="1024" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
  </g>

  <!-- Left Side: Brand & Value Prop -->
  <g transform="translate(64, 70)">
    <!-- Small Live Badge -->
    <rect x="0" y="0" width="132" height="30" rx="15" fill="rgba(255, 23, 68, 0.15)" stroke="#FF1744" stroke-width="1.5" />
    <circle cx="16" cy="15" r="5" fill="#FF1744" />
    <text x="32" y="21" font-family="sans-serif" font-size="12" font-weight="900" fill="#FF5252" letter-spacing="2">ON AIR LIVE</text>

    <!-- App Title -->
    <text x="0" y="90" font-family="sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" letter-spacing="1">KR LIVE STUDIO</text>
    <text x="0" y="128" font-family="sans-serif" font-size="20" font-weight="700" fill="url(#cyanGrad)" letter-spacing="2">DIRECT RTMP / RTMPS BROADCASTER</text>

    <!-- Tagline & Core Pillars -->
    <text x="0" y="174" font-family="sans-serif" font-size="15" fill="#94A3B8" font-weight="400">
      Hardware MediaCodec H.264 • Dual-Mixer Audio
    </text>
    <text x="0" y="200" font-family="sans-serif" font-size="15" fill="#94A3B8" font-weight="400">
      Floating Facecam PiP • Direct Ingest • Zero Relays
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 240)">
      <rect x="0" y="0" width="138" height="38" rx="10" fill="#151D2E" stroke="#1E293B" stroke-width="1" />
      <text x="18" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#00E5FF">1080p 60 FPS</text>

      <rect x="150" y="0" width="156" height="38" rx="10" fill="#151D2E" stroke="#1E293B" stroke-width="1" />
      <text x="168" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#00E5FF">INTERNAL AUDIO</text>

      <rect x="318" y="0" width="150" height="38" rx="10" fill="#151D2E" stroke="#1E293B" stroke-width="1" />
      <text x="336" y="24" font-family="sans-serif" font-size="13" font-weight="700" fill="#00E5FF">FACECAM OVERLAY</text>
    </g>

    <!-- Compatibility Row -->
    <text x="0" y="328" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="1">
      COMPATIBLE: YOUTUBE • TWITCH • FACEBOOK • TIKTOK • KICK
    </text>
  </g>

  <!-- Right Side: Master Control HUD Telemetry Card Mockup -->
  <g transform="translate(560, 50)">
    <!-- Main HUD Chassis Card -->
    <rect width="400" height="400" rx="20" fill="url(#cardGrad)" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.3" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.6))" />

    <!-- Card Header -->
    <rect x="20" y="24" width="360" height="48" rx="10" fill="#0B111D" stroke="#1E293B" stroke-width="1" />
    <circle cx="44" cy="48" r="6" fill="#00E5FF" filter="url(#glow)" />
    <text x="62" y="53" font-family="sans-serif" font-size="13" font-weight="800" fill="#E2E8F0" letter-spacing="1">STUDIO MASTER TELEMETRY</text>
    <rect x="290" y="36" width="76" height="24" rx="6" fill="#00E5FF" fill-opacity="0.15" />
    <text x="302" y="52" font-family="monospace" font-size="11" font-weight="700" fill="#00E5FF">H.264 HW</text>

    <!-- Telemetry 4-Cell Grid -->
    <g transform="translate(20, 88)">
      <!-- Cell 1: Bitrate -->
      <rect x="0" y="0" width="172" height="74" rx="10" fill="#0B111D" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">INGEST SPEED</text>
      <text x="14" y="54" font-family="monospace" font-size="22" font-weight="900" fill="#00E5FF">6000</text>
      <text x="78" y="54" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B"> kbps</text>

      <!-- Cell 2: FPS -->
      <rect x="188" y="0" width="172" height="74" rx="10" fill="#0B111D" stroke="#1E293B" stroke-width="1" />
      <text x="202" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">FRAME CADENCE</text>
      <text x="202" y="54" font-family="monospace" font-size="22" font-weight="900" fill="#00FF88">60.0</text>
      <text x="262" y="54" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B"> fps</text>

      <!-- Cell 3: Dropped -->
      <rect x="0" y="86" width="172" height="74" rx="10" fill="#0B111D" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="108" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">DROPPED FRAMES</text>
      <text x="14" y="140" font-family="monospace" font-size="22" font-weight="900" fill="#FFFFFF">0</text>
      <text x="34" y="140" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B"> (0.0%)</text>

      <!-- Cell 4: Thermal -->
      <rect x="188" y="86" width="172" height="74" rx="10" fill="#0B111D" stroke="#1E293B" stroke-width="1" />
      <text x="202" y="108" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B" letter-spacing="1">THERMAL STATE</text>
      <text x="202" y="140" font-family="sans-serif" font-size="16" font-weight="800" fill="#00FF88">OPTIMAL</text>
    </g>

    <!-- Audio VU Meter Card -->
    <g transform="translate(20, 264)">
      <rect x="0" y="0" width="360" height="48" rx="8" fill="#0B111D" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="28" font-family="sans-serif" font-size="10" font-weight="700" fill="#64748B">VU METER</text>
      <rect x="80" y="18" width="220" height="12" rx="6" fill="#1E293B" />
      <rect x="80" y="18" width="180" height="12" rx="6" fill="url(#barGrad)" />
      <text x="312" y="28" font-family="monospace" font-size="11" font-weight="700" fill="#00FF88">-6 dB</text>
    </g>

    <!-- Action Bar Simulation -->
    <g transform="translate(20, 328)">
      <rect x="0" y="0" width="360" height="48" rx="10" fill="url(#rubyGrad)" filter="url(#glow)" />
      <text x="130" y="30" font-family="sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" letter-spacing="2">● BROADCASTING</text>
    </g>
  </g>
</svg>