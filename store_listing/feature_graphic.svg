<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="fgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="25%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#fgBg)"/>
  <rect width="1024" height="500" fill="url(#centerGlow)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="1024" height="5" fill="url(#cyanLine)"/>

  <!-- Left Icon Frame -->
  <rect x="70" y="140" width="180" height="180" rx="32" fill="#131D31" stroke="#00E5FF" stroke-width="2.5"/>
  <circle cx="160" cy="230" r="55" fill="#00E5FF" fill-opacity="0.15"/>
  <text x="160" y="246" fill="#00E5FF" font-size="46" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">KR</text>

  <!-- Right Typography Block -->
  <rect x="290" y="115" width="200" height="32" rx="6" fill="#131D31" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="390" y="136" fill="#38BDF8" font-size="12" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle" letter-spacing="1.5">PRODUCTIVITY</text>

  <text x="290" y="200" fill="#FFFFFF" font-size="46" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Gluewedge Clamp &amp; Wood Glue</text>
  <text x="290" y="250" fill="#94A3B8" font-size="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Calculate clamping pressure, spacing, and glue open time for edge glue-ups.</text>
  <text x="290" y="285" fill="#64748B" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif">100% Offline &#8226; Zero Trackers &#8226; Zero Ads &#8226; Pure Native Android</text>

  <!-- Badges Row -->
  <g transform="translate(290, 325)">
    <rect x="0" y="0" width="140" height="36" rx="8" fill="#00E5FF"/>
    <text x="70" y="23" fill="#090D16" font-size="13" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">100% OFFLINE</text>

    <rect x="155" y="0" width="170" height="36" rx="8" fill="#131D31" stroke="#1E293B" stroke-width="1.2"/>
    <text x="240" y="23" fill="#38BDF8" font-size="13" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">ZERO DATA TRACKING</text>
  </g>

  <!-- Footer Watermark -->
  <text x="70" y="445" fill="#475569" font-size="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif">KimRosil App Studio</text>
  <text x="954" y="445" fill="#00E5FF" font-size="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="end">apps.kimrosil.com/gluewedge</text>
