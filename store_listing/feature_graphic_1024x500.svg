<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="60%" stop-color="#080D14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <rect width="1024" height="500" fill="url(#glowGrad)" />
  <rect width="1024" height="500" fill="url(#grid)" />

  <g transform="translate(80, 130)">
    <rect x="-10" y="-10" width="260" height="260" rx="54" fill="#00E5FF" fill-opacity="0.12" />
    <rect x="0" y="0" width="240" height="240" rx="48" fill="#09090B" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.4" />
    <g transform="translate(20, 20) scale(1.85185)">
      
        <!-- Radial Athletic Telemetry Geometry -->
        <circle fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.2" />
        <circle fill="none" stroke="#A3E635" stroke-opacity="0.12" stroke-width="1.2" />
        <path fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" d="M54,10v6 M54,92v6 M10,54h6 M92,54h6" />
        
      
        <!-- Dynamic Workout Progress Ring (Hyper-Lime) -->
        <path fill="none" stroke="#27272A" stroke-width="5" d="M54,20 a34,34 0 1,0 0,68 a34,34 0 1,0 0,-68 Z" />
        <path fill="none" stroke="#A3E635" stroke-width="5.5" stroke-linecap="round" d="M54,20 A34,34 0 1,1 26,76" />
        <circle fill="#FB923C" />
        
        <!-- Olympic Barbell Shaft -->
        <path fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" d="M24,54 h60" />
        <!-- Center Knurling Grips -->
        <path fill="none" stroke="#A3E635" stroke-width="3" d="M48,54 h12" />
        <!-- Left Weight Plates (Iron & High-Impact Bumpers) -->
        <path d="M32,42 h4 v24 h-4 Z" fill="#71717A" />
        <path d="M26,37 h5 v34 h-5 Z" fill="#E4E4E7" />
        <path d="M20,41 h4 v26 h-4 Z" fill="#FB923C" />
        <!-- Right Weight Plates (Iron & High-Impact Bumpers) -->
        <path d="M72,42 h4 v24 h-4 Z" fill="#71717A" />
        <path d="M77,37 h5 v34 h-5 Z" fill="#E4E4E7" />
        <path d="M84,41 h4 v26 h-4 Z" fill="#FB923C" />
        
    </g>
  </g>

  <g transform="translate(390, 150)">
    <rect x="0" y="0" width="210" height="28" rx="6" fill="#00E5FF" fill-opacity="0.15" />
    <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00E5FF" letter-spacing="2">KIMROSIL APP STUDIO</text>
    <text x="0" y="85" font-family="sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">PPL Workout</text>
    <text x="0" y="125" font-family="sans-serif" font-size="19" fill="#94A3B8">Offline Native Android Utility</text>

    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">⚡ 100% OFFLINE</text>
      <rect x="145" y="0" width="160" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399">🛡️ NO SUBSCRIPTION</text>
      <rect x="315" y="0" width="165" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="330" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F472B6">🔒 PRIVATE &amp; LOCAL</text>
    </g>
  </g>
</svg>