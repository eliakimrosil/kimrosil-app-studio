        <path
            fill="#FBCFE8"
            d="M75,34 c1,-2 4,-1 4,1 c0,2 -3,4 -4,4 z" />
        <!-- Glowing Water Droplet -->
        <path
            fill="#38BDF8"
            d="M32,38 c0,0 -3,4 -3,6 a3,3 0 0 0 6,0 c0,-2 -3,-6 -3,-6 z" />
        
    </g>
  </g>

  <g transform="translate(390, 150)">
    <rect x="0" y="0" width="210" height="28" rx="6" fill="#10B981" fill-opacity="0.15" />
    <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10B981" letter-spacing="2">KIMROSIL APP STUDIO</text>
    <text x="0" y="85" font-family="sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">PebbleDrift</text>
    <text x="0" y="125" font-family="sans-serif" font-size="19" fill="#94A3B8">Tactile water ripples, floating petals, stone stac...</text>

    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#38BDF8">⚡ 100% OFFLINE</text>
      <rect x="145" y="0" width="160" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399">🛡️ NO SUBSCRIPTION</text>
      <rect x="315" y="0" width="165" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="330" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F472B6">🔒 PRIVATE &amp; LOCAL</text>
