<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081018" />
      <stop offset="60%" stop-color="#0E1724" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <rect width="1024" height="500" fill="url(#glowGrad)" />
  <rect width="1024" height="500" fill="url(#grid)" />

  <g transform="translate(80, 130)">
    <rect x="-10" y="-10" width="260" height="260" rx="54" fill="#00E5FF" fill-opacity="0.12" />
    <rect x="0" y="0" width="240" height="240" rx="48" fill="#131B27" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.5" />
    <!-- Center Icon Graphics -->
    <g transform="translate(35, 35) scale(1.57)">
      <!-- Press brake punch fixture -->
      <path d="M 38 12 L 70 12 L 64 42 L 54 52 L 44 42 Z" fill="#00E5FF" opacity="0.9" />
      <path d="M 46 16 L 62 16 L 58 38 L 54 44 L 50 38 Z" fill="#131B27" opacity="0.4" />
      
      <!-- Lower V-Die -->
      <path d="M 20 84 L 40 84 L 54 68 L 68 84 L 88 84 L 88 96 L 20 96 Z" fill="#1E293B" stroke="#00E5FF" stroke-width="2" />
      
      <!-- Sheet metal formed plate -->
      <path d="M 22 58 L 48 58 L 54 64 L 60 58 L 86 58" fill="none" stroke="#F59E0B" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Neutral K-factor axis -->
      <path d="M 24 60 L 48 60 L 54 65 L 60 60 L 84 60" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2,2" />
      
      <!-- Angle indicator arc -->
      <path d="M 44 46 A 12 12 0 0 1 64 46" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="2,2" />
    </g>
  </g>

  <g transform="translate(390, 150)">
    <rect x="0" y="0" width="210" height="28" rx="6" fill="#00E5FF" fill-opacity="0.15" />
    <text x="12" y="19" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00E5FF" letter-spacing="2">KIMROSIL APP STUDIO</text>
    <text x="0" y="85" font-family="sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">BendSpec</text>
    <text x="0" y="125" font-family="sans-serif" font-size="19" fill="#94A3B8">Offline sheet metal bend allowance &amp; press brake calculator</text>

    <g transform="translate(0, 165)">
      <rect x="0" y="0" width="135" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="16" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00E5FF">⚡ 100% OFFLINE</text>
      <rect x="145" y="0" width="145" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="160" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#34D399">🛡️ ZERO ADS</text>
      <rect x="300" y="0" width="155" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="315" y="22" font-family="sans-serif" font-size="12" font-weight="bold" fill="#F59E0B">🔒 PURE NATIVE</text>
    </g>
  </g>
</svg>
