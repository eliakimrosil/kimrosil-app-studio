<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08161E" />
      <stop offset="60%" stop-color="#080D14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="25%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1024" height="500" fill="url(#bgGrad)" />
  <rect width="1024" height="500" fill="url(#glowGrad)" />
  <rect width="1024" height="500" fill="url(#grid)" />

  <g transform="translate(80, 130)">
    <rect x="-10" y="-10" width="260" height="260" rx="54" fill="#10B981" fill-opacity="0.12" />
    <rect x="0" y="0" width="240" height="240" rx="48" fill="#08161E" stroke="#10B981" stroke-width="2" stroke-opacity="0.4" />
    <g transform="translate(20, 20) scale(1.85185)">
      
        <path
            stroke="#102C3C"
            stroke-width="1.5"
