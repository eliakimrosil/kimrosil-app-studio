plugins {
    id 'base'
}

ext {
    sdkDir = file("${System.getProperty('user.home')}/.android-sdk/platforms/android-33")
    androidJar = file("${sdkDir}/android.jar")
    debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
    buildDir = file("build")
    genDir = file("${buildDir}/gen")
    intermediatesDir = file("${buildDir}/intermediates")
    classesDir = file("${intermediatesDir}/classes")
    outputsDir = file("${buildDir}/outputs")
    targetSerial = System.getenv('ANDROID_SERIAL') ?: '127.0.0.1:5555'
}

task compileResources(type: Exec) {
    description = 'Compiles Android resources using AAPT2'
    group = 'build'

    doFirst {
        genDir.mkdirs()
        intermediatesDir.mkdirs()
        outputsDir.mkdirs()
    }

    commandLine 'bash', '-c', """
        aapt2 compile --dir src/main/res -o ${intermediatesDir}/compiled_res.zip && \\
        aapt2 link --manifest src/main/AndroidManifest.xml -I ${androidJar} \\
            ${intermediatesDir}/compiled_res.zip -o ${intermediatesDir}/resources.apk \\
            --java ${genDir}
    """
}

task compileJava(type: Exec) {
    description = 'Compiles Java source code against android.jar'
    group = 'build'
    dependsOn compileResources

    doFirst {
        classesDir.mkdirs()
    }

    commandLine 'bash', '-c', """
        javac --release 8 -cp ${androidJar} -d ${classesDir} \$(find src/main/java ${genDir} -name "*.java")
    """
}

task dex(type: Exec) {
    description = 'Converts compiled bytecode into DEX format using D8'
    group = 'build'
    dependsOn compileJava

    commandLine 'bash', '-c', """
        d8 --lib ${androidJar} --output ${intermediatesDir}/ \$(find ${classesDir} -name "*.class")
    """
}

task packageApk(type: Exec) {
    description = 'Packages DEX and resources into an unaligned APK'
    group = 'build'
    dependsOn dex

    commandLine 'python3', '-c', """
import shutil, zipfile, os
shutil.copyfile("${intermediatesDir}/resources.apk", "${intermediatesDir}/unaligned.apk")
with zipfile.ZipFile("${intermediatesDir}/unaligned.apk", "a") as z:
    z.write("${intermediatesDir}/classes.dex", "classes.dex")
"""
}

task signApk(type: Exec) {
    description = 'Signs the APK using apksigner with debug keystore'
    group = 'build'
    dependsOn packageApk

    commandLine 'bash', '-c', """
        apksigner sign --ks ${debugKeystore} --ks-pass pass:android \\
            --ks-key-alias androiddebugkey --key-pass pass:android \\
            --out ${outputsDir}/${rootProject.name}-debug.apk ${intermediatesDir}/unaligned.apk
    """
}

task assembleDebug {
    description = 'Builds and packages the debug APK'
    group = 'build'
    dependsOn signApk

    doLast {
        println ">>> Build Successful! APK generated at: ${outputsDir}/${rootProject.name}-debug.apk"
    }
}

task assembleRelease {
    description = 'Builds release APK (alias for assembleDebug)'
    group = 'build'
    dependsOn assembleDebug
}

task assembleAab(type: Exec) {
    description = 'Builds official Android App Bundle (.aab) for Google Play Console'
    group = 'build'
    dependsOn dex

    commandLine 'python3', '-c', """
import os, subprocess, zipfile, shutil

intermediates = '${intermediatesDir}'
outputs = '${outputsDir}'
android_jar = '${androidJar}'

cmd = f'aapt2 link --proto-format --manifest src/main/AndroidManifest.xml -I {android_jar} {intermediates}/compiled_res.zip -o {intermediates}/proto_res.apk'
subprocess.check_call(cmd, shell=True)

base_dir = f'{intermediates}/base_module'
if os.path.exists(base_dir): shutil.rmtree(base_dir)
os.makedirs(f'{base_dir}/manifest', exist_ok=True)
os.makedirs(f'{base_dir}/dex', exist_ok=True)

with zipfile.ZipFile(f'{intermediates}/proto_res.apk', 'r') as z:
    for item in z.namelist():
        if item == 'AndroidManifest.xml':
            z.extract(item, f'{base_dir}/manifest')
        elif item == 'resources.pb':
            z.extract(item, base_dir)
        elif item.startswith('res/'):
            z.extract(item, base_dir)

shutil.copyfile(f'{intermediates}/classes.dex', f'{base_dir}/dex/classes.dex')

base_zip = f'{intermediates}/base.zip'
if os.path.exists(base_zip): os.remove(base_zip)
with zipfile.ZipFile(base_zip, 'w', zipfile.ZIP_DEFLATED) as bz:
    for root, dirs, files in os.walk(base_dir):
        for f in files:
            full = os.path.join(root, f)
            rel = os.path.relpath(full, base_dir)
            bz.write(full, rel)

aab_out = f'{outputs}/${rootProject.name}-release.aab'
cmd2 = f'bundletool build-bundle --modules={base_zip} --output={aab_out} --overwrite'
subprocess.check_call(cmd2, shell=True)
print(f'>>> Play Store AAB generated at: {aab_out}')
"""
}

task installDebug(type: Exec) {
    description = 'Installs the debug APK onto the connected Android device'
    group = 'install'
    dependsOn assembleDebug

    commandLine 'bash', '-c', """
        adb -s ${targetSerial} install -r -g ${outputsDir}/${rootProject.name}-debug.apk
    """
}

task launchApp(type: Exec) {
    description = 'Launches the main activity on the device'
    group = 'install'
    dependsOn installDebug

    commandLine 'bash', '-c', """
        PKG=\$(sed -n 's/.*package="\\([^"]*\\)".*/\\1/p' src/main/AndroidManifest.xml | head -n1)
        adb -s ${targetSerial} shell am start -n "\${PKG}/.MainActivity"
    """
}
