plugins {
    id 'base'
}

ext {
    sdkDir = file("${System.getProperty('user.home')}/.android-sdk/platforms/android-33")
    androidJar = file("${sdkDir}/android.jar")
    debugKeystore = file("${System.getProperty('user.home')}/.android/debug.keystore")
    releaseKeystore = file("${System.getProperty('user.home')}/.android/kimrosil_release.keystore")
    kotlinStdlib = file("/data/data/com.termux/files/usr/opt/kotlin/lib/kotlin-stdlib.jar")
    preDexDir = file("${System.getProperty('user.home')}/.android-sdk/pre-dexed/kotlin-stdlib")
    buildDir = file("build")
    genDir = file("${buildDir}/gen")
    intermediatesDir = file("${buildDir}/intermediates")
    classesDir = file("${intermediatesDir}/classes")
    outputsDir = file("${buildDir}/outputs")
    targetSerial = System.getenv('ANDROID_SERIAL') ?: '127.0.0.1:5555'
}

task compileResources(type: Exec) {
    description = 'Compiles Android resources using AAPT2'
    group = 'build'

    doFirst {
        genDir.mkdirs()
        intermediatesDir.mkdirs()
        outputsDir.mkdirs()
    }

    commandLine 'bash', '-c', """
        aapt2 compile --dir src/main/res -o ${intermediatesDir}/compiled_res.zip && \\
        aapt2 link --manifest src/main/AndroidManifest.xml -I ${androidJar} \\
            ${intermediatesDir}/compiled_res.zip -o ${intermediatesDir}/resources.apk \\
            --java ${genDir}
    """
}

task compileJava(type: Exec) {
    description = 'Compiles Java and Kotlin source code against android.jar'
    group = 'build'
    dependsOn compileResources

    doFirst {
        classesDir.mkdirs()
    }

    commandLine 'bash', '-c', """
        has_kt=0
        if [ -d "src/main/kotlin" ] && [ -n "\$(find src/main/kotlin -name "*.kt" -print -quit 2>/dev/null)" ]; then
            has_kt=1
        fi

        java_files=\$(find src/main/java ${genDir} -name "*.java" 2>/dev/null)
        kt_files=\$(find src/main/kotlin -name "*.kt" 2>/dev/null)

        if [ "\$has_kt" -eq 1 ]; then
            kotlinc -J-Djansi.passthrough=true -J-Dkotlin.colors.enabled=false \\
                -jvm-target 1.8 -cp ${androidJar}:${genDir} -d ${classesDir} \\
                \$kt_files \$java_files 2> >(grep -v "Failed to load native library:jansi" >&2)
            if [ -n "\$java_files" ]; then
                javac -cp ${androidJar}:${genDir}:${classesDir} -d ${classesDir} \$java_files
            fi
        else
            javac --release 8 -cp ${androidJar} -d ${classesDir} \$java_files
        fi
    """
}

task dex(type: Exec) {
    description = 'Converts compiled bytecode into DEX format using D8 with pre-dex caching'
    group = 'build'
    dependsOn compileJava

    commandLine 'bash', '-c', """
        has_kt=0
        if [ -d "src/main/kotlin" ] && [ -n "\$(find src/main/kotlin -name "*.kt" -print -quit 2>/dev/null)" ]; then
            has_kt=1
        fi

        class_files=\$(find ${classesDir} -name "*.class")
        if [ "\$has_kt" -eq 1 ]; then
            if [ ! -f "${preDexDir}/classes.dex" ]; then
                mkdir -p "${preDexDir}"
                d8 --lib ${androidJar} --min-api 26 --output "${preDexDir}/" ${kotlinStdlib}
            fi

            d8 --lib ${androidJar} --classpath ${kotlinStdlib} --min-api 26 --output ${intermediatesDir}/ \$class_files
            cp "${preDexDir}/classes.dex" "${intermediatesDir}/classes2.dex"
        else
            d8 --lib ${androidJar} --output ${intermediatesDir}/ \$class_files
        fi
    """
}

task packageApk(type: Exec) {
    description = 'Packages DEX and resources into an unaligned APK'
    group = 'build'
    dependsOn dex

    commandLine 'python3', '-c', """
import shutil, zipfile, os, glob
shutil.copyfile("${intermediatesDir}/resources.apk", "${intermediatesDir}/unaligned.apk")
with zipfile.ZipFile("${intermediatesDir}/unaligned.apk", "a") as z:
    for dex_path in glob.glob("${intermediatesDir}/classes*.dex"):
        z.write(dex_path, os.path.basename(dex_path))
"""
}

task signApk(type: Exec) {
    description = 'Signs the APK using apksigner with debug keystore'
    group = 'build'
    dependsOn packageApk

    commandLine 'bash', '-c', """
        apksigner sign --ks ${debugKeystore} --ks-pass pass:android \\
            --ks-key-alias androiddebugkey --key-pass pass:android \\
            --out ${outputsDir}/${rootProject.name}-debug.apk ${intermediatesDir}/unaligned.apk
    """
}

task assembleDebug {
    description = 'Builds and packages the debug APK'
    group = 'build'
    dependsOn signApk

    doLast {
        println ">>> Build Successful! APK generated at: ${outputsDir}/${rootProject.name}-debug.apk"
    }
}

task signReleaseApk(type: Exec) {
    description = 'Signs the APK using apksigner with production release keystore'
    group = 'build'
    dependsOn packageApk

    commandLine 'bash', '-c', """
        apksigner sign --ks ${releaseKeystore} --ks-pass pass:kimrosil2026 \\
            --ks-key-alias kimrosil --key-pass pass:kimrosil2026 \\
            --out ${outputsDir}/${rootProject.name}-release.apk ${intermediatesDir}/unaligned.apk
    """
}

task assembleRelease {
    description = 'Builds and packages the signed release APK'
    group = 'build'
    dependsOn signReleaseApk

    doLast {
        println ">>> Release Build Successful! APK generated at: ${outputsDir}/${rootProject.name}-release.apk"
    }
}

task installDebug(type: Exec) {
    description = 'Installs the debug APK onto the connected Android device'
    group = 'install'
    dependsOn assembleDebug

    commandLine 'bash', '-c', """
        adb -s ${targetSerial} install -r -g ${outputsDir}/${rootProject.name}-debug.apk
    """
}
